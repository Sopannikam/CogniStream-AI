server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: COGNISTREAM_SESSION
        http-only: true
        same-site: lax
      timeout: 7d

spring:
  application:
    name: cognistream-backend
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cognistream_db}
    username: ${DB_USER:cognistream_user}
    password: ${DB_PASSWORD:local-development-only}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:not-configured}
            client-secret: ${GITHUB_CLIENT_SECRET:not-configured}
            scope: read:user,repo
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 300s
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen2.5-coder:1.5b}
        temperature: 0.2
        num-ctx: 4096
        num-predict: 512
        keep-alive: 0s
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}
        keep-alive: 0s
    vectorstore:
      pgvector:
        initialize-schema: true
        table-name: code_vectors_nomic
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  token-encryptor-password: ${TOKEN_ENCRYPTOR_PASSWORD:local-development-change-this-password}
  token-encryptor-salt: ${TOKEN_ENCRYPTOR_SALT:0123456789abcdef}
  indexing:
    max-file-bytes: 102400
    chunk-size: 800

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
