services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cognistream-pgvector
    environment:
      POSTGRES_DB: cognistream_db
      POSTGRES_USER: ${DB_USER:-cognistream_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - cognistream_vector_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d cognistream_db"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cognistream_vector_data:
